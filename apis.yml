name: Huaun
description: 'Huaun (华云安, Huayun''an) is a Beijing-based cybersecurity company specializing in
  attack surface management, vulnerability research, and adversarial (offensive/defensive) security.
  Its product line centers on three AI-driven systems: Ai·Vul (灵洞), an adaptive threat and
  vulnerability management platform that discovers and inventories host, web, IoT, and
  container-cluster assets along with eighteen classes of digital exposure including APIs; Ai·Radar
  (灵知), a threat-intelligence engine built on natural-language processing and knowledge graphs
  across thirty-plus data sources; and Ai·Bot (灵刃), an intelligent penetration-testing and
  attack-simulation system backed by a library of over 160,000 vulnerabilities and 2,000+
  proof-of-concept exploits. Backed by DCM Ventures and other investors, Huaun helps enterprises
  continuously discover and validate their external and internal attack surface.'
